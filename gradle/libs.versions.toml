# Single source of every dependency version.
#
# The desktop port (docs/adr/0001) turns this build into several modules that all need the same
# Kotlin, Compose and serialization versions; a catalog is what keeps them from drifting apart
# one build file at a time.

[versions]
# The last AGP 8. AGP 9 is not a version bump: it drops the `kotlin.android` plugin (it carries
# Kotlin itself) and refuses `com.android.library` on a Kotlin Multiplatform module, so :core and
# :ui would both have to move to `com.android.kotlin.multiplatform.library` and its different DSL.
# That is its own change; see the AGP 9 issue. AGP 8.x also pins Gradle to 8.x — 9.7 fails to
# construct AGP's problem-reporter service.
agp = "8.13.2"
kotlin = "2.4.10"

activity-compose = "1.13.0"
compose-bom = "2026.06.01"
# Compose Multiplatform ships :ui to both Android and the desktop JVM; it tracks Kotlin
# closely, so bumping `kotlin` above means checking the compatibility table for this one too.
compose-multiplatform = "1.11.1"
# Held back deliberately: core 1.18+ and lifecycle 2.11+ declare "requires Android Gradle plugin
# 9.1.0 or higher" in their AAR metadata and fail the build on AGP 8. They move when AGP does.
core-ktx = "1.17.0"
coroutines = "1.11.0"
junit = "4.13.2"
# The engine under supabase-kt's Ktor client, pinned to the version supabase-kt itself resolves —
# OkHttp is the one engine that covers Android *and* the desktop JVM (ADR 0002, decision 6).
ktor = "3.5.1"
lifecycle = "2.10.0"
navigation-compose = "2.9.8"
serialization-json = "1.11.0"
sqldelight = "2.1.0"
# Sync (ADR 0002). Needs Kotlin 2.1+, which is why the toolchain upgrade had to land first.
supabase = "3.7.0"
test-ext-junit = "1.3.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }

ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }

supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt", version.ref = "supabase" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt", version.ref = "supabase" }

sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

test-androidx-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }
test-junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
