org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# The build cache is what keeps a CI run from recompiling four modules it has already compiled.
# It was switched off to shrink the Actions cache, but the modules here are Compose-heavy and the
# recompile costs minutes per run while the tests themselves take five seconds — the cache is the
# larger of the two savings by far. `gradle/actions/setup-gradle` stores it under ~/.gradle/caches
# along with the dependency cache, so it needs no cache entry of its own.
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
