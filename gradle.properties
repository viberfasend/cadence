org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Disabled Gradle build cache to reduce GitHub Actions cache usage
# org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP moves faster than the Kotlin Gradle plugin's tested-against matrix, and the resulting
# warning names a combination that works. Revisit when :core gains a non-JVM target.
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
