name: Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release (true to publish)'
        required: true
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main mid-publish; superseded branch builds are fair game.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.CADENCE_KEYSTORE_BASE64 }}

    steps:
      - name: Check out
        # Full history and tags: the version is derived from the commits since the last release.
        # Only fetch full history on main or when we need version info
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 0 || 1 }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches/modules-*
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Clean Gradle cache periodically
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Clean up old Gradle cache entries to prevent storage bloat
          find ~/.gradle/caches -name "*.lock" -mtime +7 -delete
          find ~/.gradle/caches -type d -name "fileHashes" -mtime +7 -exec rm -rf {} + 2>/dev/null || true

      - name: Unit tests
        # :core is a Kotlin Multiplatform module: testDebugUnitTest is its Android variant,
        # jvmTest the one the desktop app will rely on. Both run the same source set, and
        # running only one would let the other rot.
        run: ./gradlew testDebugUnitTest :core:jvmTest --stacktrace

      - name: Compile the desktop target
        # :ui has no tests of its own, but it is the module the desktop app is mostly made of.
        # Nothing else in this workflow compiles its JVM target, so without this the Android
        # build could stay green while the desktop one stopped building.
        run: ./gradlew :ui:compileKotlinJvm --stacktrace

      # Runs on every branch too, where it is only a preview of what merging would publish.
      - name: Work out the next version
        id: version
        run: bash .github/scripts/next-version.sh

      # Optional: set the CADENCE_KEYSTORE_BASE64 secret to sign the release APK with your own
      # key. Without it the release build falls back to the debug key and is still installable.
      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cadence.jks"
          echo "CADENCE_KEYSTORE=$RUNNER_TEMP/cadence.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          CADENCE_KEYSTORE_PASSWORD: ${{ secrets.CADENCE_KEYSTORE_PASSWORD }}
          CADENCE_KEY_ALIAS: ${{ secrets.CADENCE_KEY_ALIAS }}
          CADENCE_KEY_PASSWORD: ${{ secrets.CADENCE_KEY_PASSWORD }}
          # Empty on a run with nothing to release, which leaves the placeholder version in place.
          CADENCE_VERSION_NAME: ${{ steps.version.outputs.version }}
          CADENCE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # Fixed file names so the release download URL never changes between builds.
      - name: Stage APKs
        run: |
          mkdir -p dist
          cp app-android/build/outputs/apk/debug/*.apk dist/cadence-debug.apk
          cp app-android/build/outputs/apk/release/*.apk dist/cadence-release.apk
          ls -lh dist

      # A build signed by a different key than the last release cannot be installed over it —
      # the phone only says "App not installed". Catch that here rather than on a user's phone.
      - name: Check signing key
        run: bash .github/scripts/check-signing.sh dist/cadence-debug.apk dist/cadence-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cadence-debug-apk
          path: dist/cadence-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cadence-release-apk
          path: dist/cadence-release.apk
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app-android/build/reports/tests/

      # Manual release via workflow_dispatch with release=true input
      - name: Publish release
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.release == 'true' &&
          steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Cadence ${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            ${{ steps.version.outputs.notes }}

            **Install `cadence-debug.apk`** — it is signed with the standard debug key and
            installs alongside a release build.

            Permanent links, always pointing at the newest release:

            - https://github.com/${{ github.repository }}/releases/latest/download/cadence-debug.apk
            - https://github.com/${{ github.repository }}/releases/latest/download/cadence-release.apk
          files: dist/*.apk
