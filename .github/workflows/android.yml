name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.CADENCE_KEYSTORE_BASE64 }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Optional: set the CADENCE_KEYSTORE_BASE64 secret to sign the release APK with your own
      # key. Without it the release build falls back to the debug key and is still installable.
      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cadence.jks"
          echo "CADENCE_KEYSTORE=$RUNNER_TEMP/cadence.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          CADENCE_KEYSTORE_PASSWORD: ${{ secrets.CADENCE_KEYSTORE_PASSWORD }}
          CADENCE_KEY_ALIAS: ${{ secrets.CADENCE_KEY_ALIAS }}
          CADENCE_KEY_PASSWORD: ${{ secrets.CADENCE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # Fixed file names so the release download URL never changes between builds.
      - name: Stage APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/cadence-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/cadence-release.apk
          ls -lh dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cadence-debug-apk
          path: dist/cadence-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cadence-release-apk
          path: dist/cadence-release.apk
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      # Every branch push republishes the rolling "latest" release, so
      # /releases/latest/download/cadence-debug.apk is always the newest build.
      # The tag is force-moved first because updating a release does not move its tag.
      - name: Move the rolling tag
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Publish rolling release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          body: |
            Automatically published from `${{ github.ref_name }}` — commit ${{ github.sha }}.

            **Install `cadence-debug.apk`** — it is signed with the standard debug key and
            installs alongside a release build.

            Permanent links, always pointing at the newest build:

            - https://github.com/${{ github.repository }}/releases/latest/download/cadence-debug.apk
            - https://github.com/${{ github.repository }}/releases/latest/download/cadence-release.apk
          files: dist/*.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
