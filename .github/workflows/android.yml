name: Android

# Manual only. The tests it starts with already run on every pull request in ci.yml; what this
# adds is `.github/scripts/build.sh apk` — both APKs, built off-machine and uploaded as
# artifacts. It used to run on every push to every branch, which is where nearly all of this
# repository's Actions minutes went while it was private. Run it from the Actions tab when you
# actually want APKs from a runner; a laptop produces the same ones with the same script.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # GitHub's default job limit is six hours. A build that is going to work here takes
    # minutes, so anything past this is a hang, and a hang should cost a job — not an afternoon.
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # This action caches ~/.gradle itself — dependencies, the wrapper and the build cache
        # alike — so there is no actions/cache step beside it. There used to be one, restoring
        # ~/.gradle/caches/modules-* over the top of what this had already restored, with a
        # `transforms-` glob that matched nothing.
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests and the desktop compilation
        # One invocation, not two: configuring this build is the expensive part of a Gradle run
        # and a second `./gradlew` pays for all of it again.
        #
        # :core and :ui are Kotlin Multiplatform modules: testDebugUnitTest is their Android
        # variant, jvmTest the one the desktop app relies on. Both run the same source set, and
        # running only one would let the other rot. :app-desktop is a plain JVM module, so its
        # task is `test`. Naming the two modules rather than a bare `testDebugUnitTest` keeps
        # :app-android's whole debug variant — 31 tasks — out of a job that would run no test
        # from it; the `build` job below compiles that variant anyway.
        #
        # :ui:compileKotlinJvm rides along because compiling is not testing: :ui's tests cover
        # its plain-Kotlin half, and without this the Android build could stay green while the
        # screens the desktop app is mostly made of stopped compiling for the JVM.
        run: >
          ./gradlew
          :core:testDebugUnitTest :ui:testDebugUnitTest
          :core:jvmTest :ui:jvmTest :app-desktop:test
          :ui:compileKotlinJvm
          --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          # The three modules that actually have tests. :app-android has had none since storage
          # moved into :core, so the old single path uploaded an empty directory on every failure.
          path: |
            core/build/reports/tests/
            ui/build/reports/tests/
            app-desktop/build/reports/tests/

  build:
    name: Build APKs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # GitHub's default job limit is six hours. A build that is going to work here takes
    # minutes, so anything past this is a hang, and a hang should cost a job — not an afternoon.
    timeout-minutes: 45

    needs: test

    env:
      KEYSTORE_BASE64: ${{ secrets.CADENCE_KEYSTORE_BASE64 }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # On a branch this is only a preview of what merging would publish.
      - name: Work out the next version
        id: version
        run: bash .github/scripts/next-version.sh

      # The release APK is signed with the key in the CADENCE_KEYSTORE_BASE64 secret (set by
      # tools/release-signing-wizard.sh). Without it the release build falls back to the debug
      # key — still installable, but not over a release-signed install, and the signing check
      # fails when the secret is set and the key was not used.
      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/primico.jks"
          echo "CADENCE_KEYSTORE=$RUNNER_TEMP/primico.jks" >> "$GITHUB_ENV"

      # Builds, stages under the fixed names the release URLs point at, and checks the signing
      # certificate — the same script a laptop runs, so a green build here means one there.
      # Tests already ran in the `test` job above.
      - name: Build APKs
        env:
          CADENCE_KEYSTORE_PASSWORD: ${{ secrets.CADENCE_KEYSTORE_PASSWORD }}
          CADENCE_KEY_ALIAS: ${{ secrets.CADENCE_KEY_ALIAS }}
          CADENCE_KEY_PASSWORD: ${{ secrets.CADENCE_KEY_PASSWORD }}
          # The sync endpoints are compiled in at build time (NeonConfig.fromBuild); a build
          # without them offers no sync. Set with tools/release-signing-wizard.sh.
          CADENCE_NEON_DATA_API_URL: ${{ secrets.CADENCE_NEON_DATA_API_URL }}
          CADENCE_NEON_AUTH_URL: ${{ secrets.CADENCE_NEON_AUTH_URL }}
          # Empty on a run with nothing to release, which leaves the placeholder version in place.
          CADENCE_VERSION_NAME: ${{ steps.version.outputs.version }}
          CADENCE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: bash .github/scripts/build.sh apk --skip-tests

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: primico-debug-apk
          path: dist/primico-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: primico-release-apk
          path: dist/primico-release.apk
          if-no-files-found: error