name: Desktop

# Manual only, and one OS at a time by default. This used to run on every push to every branch
# and on every pull request, three runners at once — and GitHub bills a macOS minute at 10x a
# Linux one and a Windows minute at 2x, so this workflow alone cost roughly thirteen times what
# its Linux leg does. Everything the Linux leg does runs on a laptop via
# `.github/scripts/build.sh desktop`; the only thing a runner buys is a .dmg or an .msi, which
# jpackage cannot cross-compile. Ask for those explicitly, when you are cutting a release.
on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Which OS to package for'
        required: false
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, macos-latest, windows-latest, all]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # GitHub's default job limit is six hours. A build that is going to work here takes
    # minutes, so anything past this is a hang, and a hang should cost a job — not an afternoon.
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Work out the next version
        id: version
        run: bash .github/scripts/next-version.sh

      - name: Compile and test the shared modules
        # :app-desktop pulls in :core and :ui; a break in either fails here before jpackage ever
        # runs, with a clearer message than a packaging log would give. All three JVM test tasks,
        # since this leg never runs the Android compilation that `testDebugUnitTest` would.
        run: ./gradlew :core:jvmTest :ui:jvmTest :app-desktop:test :ui:compileKotlinJvm --stacktrace

  package:
    name: Package (${{ matrix.os }})
    strategy:
      # One OS failing to package (a missing WiX/rpm tool, say) shouldn't hide whether the other
      # two still work.
      fail-fast: false
      matrix:
        # One entry unless the run asked for `all` — the default keeps a manual run to a single
        # Linux runner instead of three.
        os: ${{ fromJSON(inputs.os == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    # GitHub's default job limit is six hours. A build that is going to work here takes
    # minutes, so anything past this is a hang, and a hang should cost a job — not an afternoon.
    timeout-minutes: 45

    needs: test

    # jpackage must run on the target OS (ADR 0001 §8) — there is no cross-compiling a .dmg
    # from Linux, which is the only reason this job exists on a runner at all.
    defaults:
      run:
        # Available on all three runner images (Windows via the bundled Git Bash), and lets
        # every step below read the same on every OS instead of forking into os-specific scripts.
        shell: bash

    steps:
      - name: Check out
        # Full history and tags: the version is derived from the commits since the last release,
        # same as android.yml.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # jpackage shells out to the OS's own packaging tool for each format, and none of these
      # three ship on a bare runner image.
      - name: Install Linux packaging tools (deb/rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Install WiX Toolset (msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset -y
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\WiX Toolset v3.14\bin"

      # Same script android.yml uses, so the two never name a build two different versions.
      - name: Work out the next version
        id: version
        run: bash .github/scripts/next-version.sh

      # `desktop` resolves to whatever this OS can package — deb, rpm and a tarball on Linux, a
      # dmg on macOS, an msi on Windows — so every leg shares one command instead of forking on
      # runner.os. Tests already ran in the `test` job above.
      - name: Package for this OS
        env:
          # Empty on a run with nothing to release, which leaves the build.gradle.kts fallback
          # ("1.0.0") in place.
          CADENCE_VERSION_NAME: ${{ steps.version.outputs.version }}
          # The sync endpoints are compiled in at build time (NeonConfig.fromBuild); a build
          # without them offers no sync. Set with tools/release-signing-wizard.sh.
          CADENCE_NEON_DATA_API_URL: ${{ secrets.CADENCE_NEON_DATA_API_URL }}
          CADENCE_NEON_AUTH_URL: ${{ secrets.CADENCE_NEON_AUTH_URL }}
        run: bash .github/scripts/build.sh desktop --skip-tests

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: primico-desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error