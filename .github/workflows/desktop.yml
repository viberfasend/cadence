name: Desktop

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    # Run tests on PRs and all pushes, but skip heavy packaging on PRs
    if: always()

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Shallow clone for PRs, full history for main/workflow_dispatch
          fetch-depth: ${{ (github.ref == 'refs/heads/main' || github.event_name != 'pull_request') && 0 || 1 }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches/modules-*
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Work out the next version
        id: version
        run: bash .github/scripts/next-version.sh

      - name: Compile and test the shared modules
        # :app-desktop pulls in :core and :ui; a break in either fails here before jpackage ever
        # runs, with a clearer message than a packaging log would give.
        run: ./gradlew :core:jvmTest :ui:compileKotlinJvm --stacktrace

  package:
    name: Package (${{ matrix.os }})
    strategy:
      # One OS failing to package (a missing WiX/rpm tool, say) shouldn't hide whether the other
      # two still work.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Only package on push to main or workflow_dispatch, not on PRs
    if: github.event_name != 'pull_request'

    needs: test

    # jpackage must run on the target OS (ADR 0001 §8), so every step below runs three times
    # rather than once — there is no cross-compiling a .dmg from Linux.
    defaults:
      run:
        # Available on all three runner images (Windows via the bundled Git Bash), and lets
        # every step below read the same on every OS instead of forking into os-specific scripts.
        shell: bash

    steps:
      - name: Check out
        # Full history and tags: the version is derived from the commits since the last release,
        # same as android.yml.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches/modules-*
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Clean Gradle cache periodically
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        run: |
          # Clean up old Gradle cache entries to prevent storage bloat
          find ~/.gradle/caches -name "*.lock" -mtime +7 -delete
          find ~/.gradle/caches -type d -name "fileHashes" -mtime +7 -exec rm -rf {} + 2>/dev/null || true

      # jpackage shells out to the OS's own packaging tool for each format, and none of these
      # three ship on a bare runner image.
      - name: Install Linux packaging tools (deb/rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Install WiX Toolset (msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset -y
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\WiX Toolset v3.14\bin"

      # Runs on every branch too, where it is only a preview of what merging would publish —
      # same script android.yml uses, so the two never name a build two different versions.
      - name: Work out the next version
        id: version
        run: bash .github/scripts/next-version.sh

      # `desktop` resolves to whatever this OS can package — deb, rpm and a tarball on Linux, a
      # dmg on macOS, an msi on Windows — so the three legs share one command instead of forking
      # on runner.os. Tests already ran in the `test` job above.
      - name: Package for this OS
        env:
          # Empty on a run with nothing to release, which leaves the build.gradle.kts fallback
          # ("1.0.0") in place.
          CADENCE_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/build.sh desktop --skip-tests

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cadence-desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error