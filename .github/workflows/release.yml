name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run - build and test without publishing'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.CADENCE_KEYSTORE_BASE64 }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches/modules-*
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:jvmTest --stacktrace

      - name: Compile the desktop target
        run: ./gradlew :ui:compileKotlinJvm --stacktrace

      - name: Work out the next version
        id: version
        run: bash .github/scripts/next-version.sh

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cadence.jks"
          echo "CADENCE_KEYSTORE=$RUNNER_TEMP/cadence.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          CADENCE_KEYSTORE_PASSWORD: ${{ secrets.CADENCE_KEYSTORE_PASSWORD }}
          CADENCE_KEY_ALIAS: ${{ secrets.CADENCE_KEY_ALIAS }}
          CADENCE_KEY_PASSWORD: ${{ secrets.CADENCE_KEY_PASSWORD }}
          CADENCE_VERSION_NAME: ${{ steps.version.outputs.version }}
          CADENCE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Stage APKs
        run: |
          mkdir -p dist
          cp app-android/build/outputs/apk/debug/*.apk dist/cadence-debug.apk
          cp app-android/build/outputs/apk/release/*.apk dist/cadence-release.apk

      - name: Check signing key
        run: bash .github/scripts/check-signing.sh dist/cadence-debug.apk dist/cadence-release.apk

      - name: Upload APKs for release
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: dist/*
          if-no-files-found: error

  build-desktop:
    name: Build Desktop Installers
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches/modules-*
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Work out the next version
        id: version
        run: bash .github/scripts/next-version.sh

      - name: Install Linux packaging tools (deb/rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Install WiX Toolset (msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset -y
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\WiX Toolset v3.14\bin"

      - name: Compile and test the shared modules
        run: ./gradlew :core:jvmTest :ui:compileKotlinJvm --stacktrace

      - name: Package for this OS
        env:
          CADENCE_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ./gradlew :app-desktop:packageDistributionForCurrentOS :app-desktop:createDistributable --stacktrace
          else
            ./gradlew :app-desktop:packageDistributionForCurrentOS --stacktrace
          fi

      - name: Tar the Linux app image
        if: runner.os == 'Linux'
        run: tar -C app-desktop/build/compose/binaries/main/app -czf cadence-linux-x64.tar.gz .

      - name: Stage installers
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in app-desktop/build/compose/binaries/main/deb/*.deb \
                   app-desktop/build/compose/binaries/main/rpm/*.rpm \
                   app-desktop/build/compose/binaries/main/dmg/*.dmg \
                   app-desktop/build/compose/binaries/main/msi/*.msi; do
            cp "$f" dist/
          done
          [ -f cadence-linux-x64.tar.gz ] && cp cadence-linux-x64.tar.gz dist/

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-assets-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    if: inputs.dry-run != 'true'

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: bash .github/scripts/next-version.sh

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: release-assets

      - name: Download Desktop Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-assets-ubuntu-latest
          path: release-assets

      - name: Download Desktop macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-assets-macos-latest
          path: release-assets

      - name: Download Desktop Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-assets-windows-latest
          path: release-assets

      - name: List all release assets
        run: ls -laR release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Cadence ${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            ${{ steps.version.outputs.notes }}

            ## Downloads

            ### Android
            - **[Debug APK](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/cadence-debug.apk)** - Signed with debug key, installs alongside release builds
            - **[Release APK](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/cadence-release.apk)** - Production build

            ### Desktop

            #### Linux
            - **[Debian Package (.deb)](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/cadence_${{ steps.version.outputs.version }}_amd64.deb)**
            - **[RPM Package (.rpm)](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/cadence_${{ steps.version.outputs.version }}_x86_64.rpm)**
            - **[Tarball](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/cadence-linux-x64.tar.gz)**

            #### macOS
            - **[Disk Image (.dmg)](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Cadence-${{ steps.version.outputs.version }}.dmg)**

            #### Windows
            - **[MSI Installer](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Cadence-${{ steps.version.outputs.version }}.msi)**

            ---

            **Permanent latest download links:**
            - https://github.com/${{ github.repository }}/releases/latest/download/cadence-debug.apk
            - https://github.com/${{ github.repository }}/releases/latest/download/cadence-release.apk
          files: release-assets/*
          fail_on_unmatched_files: false
