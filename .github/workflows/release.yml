name: Release

# The one workflow that publishes anything, and it only ever runs when a human dispatches it
# from the Actions tab — same rule as android.yml and desktop.yml (no push, no schedule).
#
# It also only ever releases from `main`: the tag is created from whatever commit the run was
# dispatched on, so a run started on a feature branch would publish a release pointing at
# unmerged work. The preflight job refuses rather than letting that happen.
#
# What it builds is an input, and the default is deliberately the cheap half: the Android APKs
# plus the Linux `.deb`, which is one Linux runner for each. `all` adds the rpm, the tarball, the
# .dmg and the .msi — and with them a macOS runner billed at 10x a Linux minute and a Windows one
# at 2x. Ask for those when someone actually needs them.
#
# Everything below calls `.github/scripts/build.sh`, the same script a laptop runs, so a release
# can equally be cut by hand: `bash .github/scripts/build.sh apk deb && gh release create …`.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'What to build and publish'
        required: false
        default: android+deb
        type: choice
        options:
          - android+deb   # APKs + the Linux .deb — two Linux runners, the usual release
          - android       # APKs only
          - deb           # the Linux .deb only
          - all           # + rpm, tarball, .dmg and .msi (adds a macOS and a Windows runner)
      dry-run:
        description: 'Build and test, but publish nothing'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Derives the version once, for every job below, and is where the two ways a release can be
  # wrong — wrong branch, nothing to release — turn into an error before a runner spends five
  # minutes building.
  preflight:
    name: Preflight
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # GitHub's default job limit is six hours. A build that is going to work here takes
    # minutes, so anything past this is a hang, and a hang should cost a job — not an afternoon.
    timeout-minutes: 10

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      version_code: ${{ steps.version.outputs.version_code }}
      notes: ${{ steps.version.outputs.notes }}

    steps:
      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A release is cut from main — this run is on ${GITHUB_REF#refs/}."
          exit 1

      - name: Check out
        # Full history and tags: the version is derived from the commits since the last v* tag.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: bash .github/scripts/next-version.sh

      - name: Refuse to release nothing
        # next-version.sh reports skip=true when HEAD is already the last tag. Releasing then
        # would publish a second release carrying the same commits under a new version.
        if: steps.version.outputs.skip == 'true'
        env:
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          echo "::error::No commits since ${PREVIOUS_TAG} — nothing to release."
          exit 1

      - name: Summarise the plan
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BUMP: ${{ steps.version.outputs.bump }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          {
            echo "### Primico ${VERSION}"
            echo
            echo "- tag: \`${TAG}\` (${BUMP} bump from \`${PREVIOUS_TAG:-no previous tag}\`)"
            echo "- targets: \`${{ inputs.targets }}\`"
            echo "- dry run: \`${{ inputs.dry-run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: Android APKs
    needs: preflight
    if: inputs.targets != 'deb'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # GitHub's default job limit is six hours. A build that is going to work here takes
    # minutes, so anything past this is a hang, and a hang should cost a job — not an afternoon.
    timeout-minutes: 45

    env:
      KEYSTORE_BASE64: ${{ secrets.CADENCE_KEYSTORE_BASE64 }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The release APK is signed with the key in the CADENCE_KEYSTORE_BASE64 secret (set by
      # tools/release-signing-wizard.sh). Without it the release build falls back to the
      # committed debug key — see the comment block in app-android/build.gradle.kts — and a
      # release cut that way could not update a release-signed install, so build.sh's signing
      # check fails when the secret is set and the key was not used.
      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/primico.jks"
          echo "CADENCE_KEYSTORE=$RUNNER_TEMP/primico.jks" >> "$GITHUB_ENV"

      # Tests, build, staging under the fixed names the download URLs point at, and the signing
      # check, in one script — the same one a laptop runs. Tests are not skipped here: this is
      # the run that publishes, so it is the one run that has to prove itself.
      - name: Test and build the APKs
        env:
          CADENCE_KEYSTORE_PASSWORD: ${{ secrets.CADENCE_KEYSTORE_PASSWORD }}
          CADENCE_KEY_ALIAS: ${{ secrets.CADENCE_KEY_ALIAS }}
          CADENCE_KEY_PASSWORD: ${{ secrets.CADENCE_KEY_PASSWORD }}
          CADENCE_VERSION_NAME: ${{ needs.preflight.outputs.version }}
          CADENCE_VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
          # The sync endpoints are compiled in at build time (NeonConfig.fromBuild); a build
          # without them offers no sync. Set with tools/release-signing-wizard.sh.
          CADENCE_NEON_DATA_API_URL: ${{ secrets.CADENCE_NEON_DATA_API_URL }}
          CADENCE_NEON_AUTH_URL: ${{ secrets.CADENCE_NEON_AUTH_URL }}
        run: bash .github/scripts/build.sh apk

      - name: Upload the APKs
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-android
          path: dist/*
          if-no-files-found: error

  build-desktop:
    name: Desktop (${{ matrix.os }})
    needs: preflight
    if: inputs.targets != 'android'

    strategy:
      # A missing WiX or rpmbuild on one leg shouldn't hide whether the others packaged.
      fail-fast: false
      matrix:
        # One Linux runner unless the run asked for `all`. jpackage shells out to the target
        # OS's own packaging tool (ADR 0001 §8), so a .dmg or an .msi is the only thing this
        # matrix buys that a Linux laptop cannot produce itself.
        os: ${{ fromJSON(inputs.targets == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # GitHub's default job limit is six hours. A build that is going to work here takes
    # minutes, so anything past this is a hang, and a hang should cost a job — not an afternoon.
    timeout-minutes: 60

    defaults:
      run:
        # Available on all three runner images (Windows via the bundled Git Bash), so every step
        # reads the same everywhere instead of forking on the OS.
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # jpackage's deb/rpm backends and the msi one shell out to these; no runner image ships them.
      - name: Install Linux packaging tools (deb/rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Install WiX Toolset (msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset -y
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\WiX Toolset v3.14\bin"

      - name: Test and package for this OS
        env:
          CADENCE_VERSION_NAME: ${{ needs.preflight.outputs.version }}
          # Same two endpoints as the Android job: the desktop app is built from the same :core.
          CADENCE_NEON_DATA_API_URL: ${{ secrets.CADENCE_NEON_DATA_API_URL }}
          CADENCE_NEON_AUTH_URL: ${{ secrets.CADENCE_NEON_AUTH_URL }}
          # Naming `deb` outright rather than `desktop` is what makes a missing fakeroot fail the
          # run: build.sh only demotes a format to a warning when an alias implied it, and a
          # release that quietly ships without the .deb is the failure this job exists to catch.
          # `all` asks for whatever this OS can package instead — deb+rpm+tar, dmg, or msi.
          FORMATS: ${{ inputs.targets == 'all' && 'desktop' || 'deb' }}
          # :core, :ui and :app-desktop are the same JVM source on every runner, so the tests are
          # run once, on the cheap OS. The macOS and Windows legs only ever exist under `all`,
          # where this Linux leg has already run them. Written as `!= Linux && flag || ''`
          # rather than the other way round because an empty string is falsy in a GitHub
          # expression, so `cond && '' || flag` yields the flag on both branches.
          SKIP_TESTS: ${{ runner.os != 'Linux' && '--skip-tests' || '' }}
        run: |
          # shellcheck disable=SC2086  # unquoted on purpose: SKIP_TESTS is empty on Linux, and
          # quoting it would hand build.sh an empty argument it rejects as an unknown target.
          bash .github/scripts/build.sh $FORMATS $SKIP_TESTS

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [preflight, build-android, build-desktop]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # GitHub's default job limit is six hours. A build that is going to work here takes
    # minutes, so anything past this is a hang, and a hang should cost a job — not an afternoon.
    timeout-minutes: 15

    # A skipped build job (`android` or `deb` alone) must not skip the publish with it, which is
    # what a bare `needs` would do — hence !failure() rather than success(). `!inputs.dry-run`
    # reads the boolean input as a boolean: comparing it against the string 'true' is how the
    # previous version of this job managed to be both always-skipped and never-skipped.
    if: ${{ !cancelled() && !failure() && !inputs.dry-run }}

    steps:
      - name: Download every build's assets
        # One pattern rather than four named downloads: which artifacts exist depends on the
        # targets input, and naming an absent one fails the job.
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Compose the release body
        env:
          NOTES: ${{ needs.preflight.outputs.notes }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la release-assets
          shopt -s nullglob

          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          debug='' release='' deb='' rpm='' tarball='' macos='' windows=''

          # Built from what actually landed, not from a fixed list — a run that packaged no .msi
          # should not publish a link that 404s. One variable per format rather than one per
          # section, so the order inside a section is this list's rather than the glob's.
          for file in release-assets/*; do
            name="$(basename "$file")"
            case "$name" in
              primico-debug.apk)
                debug="- [Debug APK]($base/$name) — signed with the committed debug key, installs beside a release build"$'\n' ;;
              primico-release.apk)
                release="- [Release APK]($base/$name)"$'\n' ;;
              *.deb) deb+="- [Debian package (.deb)]($base/$name)"$'\n' ;;
              *.rpm) rpm+="- [RPM package (.rpm)]($base/$name)"$'\n' ;;
              *.tar.gz) tarball+="- [Tarball]($base/$name)"$'\n' ;;
              *.dmg) macos+="- [Disk image (.dmg)]($base/$name)"$'\n' ;;
              *.msi) windows+="- [Installer (.msi)]($base/$name)"$'\n' ;;
              *) echo "note: $name has no download heading, publishing it unlisted" ;;
            esac
          done

          android="${release}${debug}"
          linux="${deb}${rpm}${tarball}"

          if [[ -z "$android$linux$macos$windows" ]]; then
            echo "::error::No release assets were built."
            exit 1
          fi

          # `if` rather than `[[ … ]] && printf`: the && form returns 1 when the test fails, and
          # under `set -e` an empty section would end the step instead of being left out.
          section() { [[ -n "$2" ]] && printf '### %s\n\n%s\n' "$1" "$2"; return 0; }

          {
            printf '%s\n\n## Downloads\n\n' "$NOTES"
            section Android "$android"
            section Linux "$linux"
            section macOS "$macos"
            section Windows "$windows"
            if [[ -n "$android" ]]; then
              printf -- '---\n\n**Permanent latest download links:**\n\n'
              printf -- '- https://github.com/%s/releases/latest/download/primico-debug.apk\n' "$GITHUB_REPOSITORY"
              printf -- '- https://github.com/%s/releases/latest/download/primico-release.apk\n' "$GITHUB_REPOSITORY"
            fi
          } > release-body.md

          cat release-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        # The tag is created from the commit this run was dispatched on, which the preflight job
        # has already established is main's tip. make_latest moves
        # releases/latest/download/primico-debug.apk onto this build.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Primico ${{ needs.preflight.outputs.version }}
          body_path: release-body.md
          make_latest: true
          files: release-assets/*
          fail_on_unmatched_files: true
